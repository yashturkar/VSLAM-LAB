# Empirical stereo extrinsics for the six BorealHDR 2023-09-27 recordings.
# The supplied September camera_info YAMLs have identity rectification rotations
# and leave approximately 7-8 px of vertical disparity at 960x600. This fit
# uses 11 paired 4 ms frames (25% and 75% of each recording where available),
# 3,858 ORB ratio-test correspondences, and OpenCV essential-matrix RANSAC.
# 2,837 essential-matrix inliers; 2,837 recoverPose inliers. Held-out frames
# at 0%, 50%, and 99% of each recording had median vertical residual <1 px.
# Translation is a direction; preparation scales it to the baseline encoded
# in the supplied right-camera projection matrix, rather than claiming an
# independently surveyed stereo baseline.
